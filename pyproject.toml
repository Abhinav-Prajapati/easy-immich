[project]
name = "easy-immich"
version = "0.1.0"
description = "Fetch images from Immich, extract DINOv2 embeddings, store in ChromaDB"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.35.0",
    "pillow>=9.0.0",
    "tqdm>=4.65.0",
    "httpx>=0.24.0",
    "chromadb>=0.4.0",
    "python-dotenv>=1.0.0",
    "numpy>=1.20.0",
    "torchvision>=0.27.0",
    "scikit-learn>=1.7.2",
]
